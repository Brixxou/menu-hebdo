<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ff9500">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Menu Hebdo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <main id="app">
    <header class="app-header">
      <h1 id="app-title">Menu Hebdo</h1>
      <button class="btn-link" id="btn-settings" aria-label="Réglages"><span data-icon="settings" data-icon-size="22"></span></button>
    </header>
    <section id="view-semaine" class="view active" data-tab="semaine"></section>
    <section id="view-courses" class="view" data-tab="courses"></section>
    <section id="view-recettes" class="view" data-tab="recettes"></section>
    <nav class="tab-bar">
      <button class="tab-btn active" data-target="semaine"><span class="tab-icon" data-icon="calendar" data-icon-size="22"></span><span>Semaine</span></button>
      <button class="tab-btn" data-target="courses"><span class="tab-icon" data-icon="cart" data-icon-size="22"></span><span>Courses</span></button>
      <button class="tab-btn" data-target="recettes"><span class="tab-icon" data-icon="book" data-icon-size="22"></span><span>Recettes</span></button>
    </nav>
    <div id="modal-root"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
